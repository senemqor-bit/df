<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Interval Ride</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600&family=Saira+Semi+Condensed:wght@600;800&display=swap">
<link rel="stylesheet" href="overlay.css">
<style>
  /* 레이아웃: 위에서부터 큰 타이머 → 운동 프로필(구간 그래프) → 구간 목록. 실내 운동용 화면이라 어두운 테마 하나로 고정 */
  :root {
    --bg: #0b0d14;
    --panel: #141824;
    --line: #262b3b;
    --fg: #eef0f6;
    --muted: #9aa1b5;
    --warm: #5f8dff;
    --sprint: #ff3d57;
    --rec: #ffd84a;
    --font-display: "Saira Semi Condensed", "Arial Narrow", system-ui, sans-serif;
    --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.55;
  }
  .wrap {
    max-width: 1080px;
    margin: 0 auto;
    padding-inline: 16px;
    padding-block: 20px 40px;
    display: flex;
    flex-direction: column;
    gap: 28px;
  }
  header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 20px; }
  h1 {
    margin: 0;
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 26px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  h1 span { color: var(--sprint); }
  header p { margin: 0; color: var(--muted); font-size: 14px; }

  .stage {
    position: relative;
    height: min(46vh, 420px, calc(56vw + 40px));
    min-height: 200px;
    border-radius: 14px;
    background:
      radial-gradient(120% 90% at 20% 0%, #1b2133 0%, transparent 60%),
      var(--panel);
    border: 1px solid var(--line);
    display: grid;
    place-items: center;
    overflow: hidden;
    padding: 12px;
  }
  .stage-note {
    margin: 0;
    color: var(--muted);
    font-size: 14px;
    text-align: center;
    max-width: 34ch;
  }

  .tools { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
  .btn {
    font: 600 14px/1 var(--font-body);
    color: var(--fg);
    background: #20263a;
    border: 1px solid #333b55;
    border-radius: 999px;
    padding: 11px 18px;
    cursor: pointer;
  }
  .btn:hover { background: #29304a; }
  .btn:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
  .tools p { margin: 0; color: var(--muted); font-size: 13.5px; flex: 1 1 260px; min-width: 0; }

  h2 {
    margin: 0 0 12px;
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 15px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
  }

  /* 운동 프로필: 막대 폭 = 구간 길이, 높이 = 강도 */
  .profile { position: relative; height: 120px; display: flex; align-items: flex-end; gap: 2px; }
  .seg {
    all: unset;
    cursor: pointer;
    position: relative;
    height: 100%;
    display: flex;
    align-items: flex-end;
    min-width: 0;
  }
  .seg i { display: block; width: 100%; border-radius: 3px 3px 0 0; opacity: 0.55; transition: opacity 0.2s; }
  .seg:hover i, .seg.is-now i { opacity: 1; }
  .seg:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
  .seg.is-past i { opacity: 0.28; }
  .playhead {
    position: absolute;
    top: -6px;
    bottom: 0;
    width: 2px;
    background: var(--fg);
    box-shadow: 0 0 0 1px var(--bg);
    pointer-events: none;
    transition: left 0.2s linear;
  }
  .axis { position: relative; height: 22px; margin-top: 6px; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .axis span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
  .axis span:first-child { transform: none; }
  .axis span:last-child { transform: translateX(-100%); }

  .list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 6px;
  }
  .list button {
    all: unset;
    box-sizing: border-box;
    width: 100%;
    cursor: pointer;
    display: grid;
    grid-template-columns: 3.2em 1fr auto;
    align-items: center;
    gap: 10px;
    padding: 9px 12px;
    border-radius: 8px;
    background: var(--panel);
    border: 1px solid var(--line);
    font-variant-numeric: tabular-nums;
  }
  .list button:hover { border-color: #3a4260; }
  .list button:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
  .list .at { color: var(--muted); font-size: 13px; }
  .list .name { font-family: var(--font-display); font-weight: 800; letter-spacing: 0.05em; }
  .list .name small { font-family: var(--font-body); font-weight: 400; letter-spacing: 0; color: var(--muted); margin-left: 6px; font-size: 12.5px; }
  .list .dur { font-weight: 600; }
  .list .is-now button { border-color: var(--fg); background: #1b2030; }
  .list .is-past button { opacity: 0.5; }
  .k-warmup, .k-cooldown { color: var(--warm); }
  .k-sprint { color: var(--sprint); }
  .k-recovery { color: var(--rec); }

  .source { color: var(--muted); font-size: 13px; margin: 0; }
  .source a { color: var(--fg); }

  /* 작은 창(PiP) 안 */
  body.pip { display: grid; place-items: center; height: 100vh; overflow: hidden; padding: 0; }

  @media (max-width: 520px) {
    .profile { height: 90px; }
    h1 { font-size: 22px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .playhead, .seg i { transition: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Interval <span>Ride</span></h1>
    <p>30분 실내자전거 인터벌 · 15개 구간</p>
  </header>

  <section class="stage" id="stage" aria-label="타이머">
    <p class="stage-note" id="stage-note" hidden>타이머가 작은 창에 떠 있습니다. 작은 창을 닫으면 이곳으로 돌아옵니다.</p>
  </section>

  <div class="tools">
    <button type="button" class="btn" id="pip-btn" hidden>작은 창으로 띄우기</button>
    <p id="pip-help">원을 누르면 시작하고, 한 번 더 누르면 멈춥니다. 구간이 바뀌기 3초 전부터 짧은 알림음이 울립니다.</p>
  </div>

  <section aria-labelledby="profile-h">
    <h2 id="profile-h">운동 프로필</h2>
    <div class="profile" id="profile"></div>
    <div class="axis" id="axis"></div>
  </section>

  <section aria-labelledby="list-h">
    <h2 id="list-h">구간 목록 · 눌러서 이동</h2>
    <ol class="list" id="list"></ol>
  </section>

  <p class="source">구간 구성 출처: <a href="https://youtu.be/xEhPT6ydXRY" target="_blank" rel="noopener">30분 실내자전거 운동 (YouTube)</a> 화면 타이머</p>
</div>
<script src="interval-core.js" charset="utf-8"></script>
<script src="timer.js" charset="utf-8"></script>
</body>
</html>
